[runtime]
sampler = emcee
root = ${PWD}
verbosity = quiet

[test]
save_dir=output/module_tutorial
fatal_errors=T

[emcee]
walkers = 32
samples = 300
nsteps = 10

[output]
filename = output/module_tutorial.txt
format = text

[pipeline]
modules = consistency astropy module_tutorial
values = examples/module_tutorial_values.ini

[consistency]
file = utility/consistency/consistency_interface.py
cosmomc_theta = T

[astropy]
file = background/astropy_background/astropy_background.py
zmax = 2
nz = 200
model = LambdaCDM ; "lambdacdm" if this fails

[module_tutorial]
file = examples/module_tutorial.py