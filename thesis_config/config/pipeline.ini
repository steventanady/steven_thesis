[DEFAULT]
MY_PATH = /home/steven
CSL_PATH = %(MY_PATH)s/cosmosis-standard-library
MOD_PATH = %(MY_PATH)s/Work/cosmosis_stuff/mod/
PROJECT_PATH = %(MY_PATH)s/Work/cosmosis_stuff/thesis_config

[runtime]
sampler = test
resume = T 
verbosity = quiet

[test]
save_dir = output/test
fatal_errors = T

[emcee]
walkers = 32
nsteps = 1
samples = 2

[multinest]
max_iterations=2
multinest_outfile_root= %(OUTPUT_FOLDER)s
resume=T
tolerance = 0.01
constant_efficiency = F
live_points = 1000
efficiency = 0.3

[pipeline]
modules = consistency mymodule
values = %(PROJECT_PATH)s/values.ini

[consistency]
file = %(CSL_PATH)s/utility/consistency/consistency_interface.py
cosmomc_theta = T

[mymodule]
file = %(MOD_PATH)s/mymodule.py
zmax = 2 ;temporary
nz = 200 ;temporary

